[build-system]
requires = ["uv_build>=0.11.0"]
build-backend = "uv_build"

[project]
name = "newrl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gitpython",
    "imgui_bundle>=1.92.0",
    "newton[sim,importers,onnx]",
    "pyyaml>=6.0",
    "setproctitle>=1.3.7",
    "ovrtx>=0.7.0.1794596436",
    "ovstage>=0.4.0.1794520352",
    "pyglet>=2.1.6,<3",
    "tensordict>=0.15.6",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "wandb>=0.31.2",
    "assetx",
]

[project.optional-dependencies]
viser = ["viser>=1.1.1"]
torchrunx = ["torchrunx>=0.3.4"]

[project.scripts]
newrl = "newrl.cli:main"

[tool.uv.sources]
newton = { path = "../newton", editable = true }
assetx = { git = "https://github.com/btx0424/assetx.git", branch = "main" }
ovstage = { index = "pypi" }
ovrtx = { index = "pypi" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.build-backend]
module-name = "newrl"
module-root = "src"
